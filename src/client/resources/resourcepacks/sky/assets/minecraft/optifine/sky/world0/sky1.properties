# ===================================================================
#  NanbeiTnT 自定义天空 · 主世界（world0）天空层
#  适用：OptiFine / Lunar / Badlion 的「自定义天空」，
#        或 Fabric 的 Skyboxify / Nuit+Interop
#  位置：assets/minecraft/optifine/sky/world0/<层号>.properties
# ===================================================================
#
#  【最容易踩的坑】注释必须单独占一行！
#  .properties 的语法里，只有「行首的 #」才是注释；
#  写在值的后面，那个 # 连同后面的文字会被当成「值的一部分」。
#  例如原来写的：
#      source=./cloud1.png        #天空图片匹配
#  实际被读到的路径是 "./cloud1.png        #天空图片匹配"，
#  这个文件当然不存在 → 这一层天空加载失败，资源包重载就会报错。
#  下面所有注释都已经挪到单独一行，你可以放心照着改。
#
# -------------------------------------------------------------------
# 一、淡入 / 淡出时间（24 小时制 hh:mm）
#     startFadeIn  → endFadeIn      亮度 0 → 1（慢慢显现）
#     endFadeIn    → startFadeOut   亮度保持 1（完全显示）
#     startFadeOut → endFadeOut     亮度 1 → 0（慢慢消失）
#     startFadeOut 可以省略，它由另外三个值唯一确定。
#     四个时间全都不写 = 这一层永远满亮度渲染。
# -------------------------------------------------------------------
startFadeIn=5:30
endFadeIn=6:00
startFadeOut=18:30
endFadeOut=19:30

# -------------------------------------------------------------------
# 二、混合方式（这一层怎么和上一层 / 原版天空叠加）
#     replace = 直接整幅替换掉原版天空。
#               注意 replace 没有渐变：只要算出来的亮度 > 0，
#               就按整幅像素值覆盖。
#     其它可选：add / subtract / multiply / dodge / burn / screen / overlay / alpha
#     默认是 add。
# -------------------------------------------------------------------
blend=replace

# -------------------------------------------------------------------
# 三、旋转
#     rotate = 天空盒是否随时间绕轴旋转
#     speed  = 相对「一天转一整圈(360°)」的倍数，0.5 表示两天转一圈；
#              注意它不影响淡入淡出（淡入淡出固定按 24 小时走）
#     axis   = 旋转轴向量 (x y z)，默认 0.0 0.0 1.0（沿南北轴，像太阳东升西落）；
#              0.0 1.0 0.0 = 绕世界垂直轴转，观感像「天顶陀螺」
# -------------------------------------------------------------------
rotate=true
speed=1.0
axis=0.0 1.0 0.0

# -------------------------------------------------------------------
# 四、天空贴图路径（这一层唯一的必填项）
#     路径有四种写法，任选一种：
#       path/cloud1.png   → assets/minecraft/path/cloud1.png
#       ~/cloud1.png      → assets/minecraft/optifine/cloud1.png
#       ./cloud1.png      → 和本文件同一个目录（当前用的就是这种）
#       minecraft:...     → 带命名空间的绝对路径
#     不写 source 时，默认找同目录下的 sky<层号>.png。
# -------------------------------------------------------------------
source=./cloud1.png

# -------------------------------------------------------------------
# 五、可选限制条件（需要时把行首的 # 去掉即可）
#     weather=clear rain thunder   只在指定天气显示
#     biomes=desert                只在指定群系显示（前面加 ! 表示「除它之外」）
#     heights=100-256              只在指定高度区间显示（1.18+ 的负高度写成 (-64)-100）
#     transition=5                 亮度过渡时长（秒），默认 1
#     days=0 2-4 6 / daysLoop=8    只在循环周期里的第几天显示
# -------------------------------------------------------------------
# weather=clear
# biomes=desert
# heights=100-256
# transition=5
# days=0 2-4 6
# daysLoop=8
