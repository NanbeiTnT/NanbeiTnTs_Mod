# Done to increase the memory available to gradle.
# 1G 跑 runClient / datagen 容易 OOM，给到 2G 更稳。
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# 告诉 Gradle 去哪找 JDK：这台机器的 JDK 21 不在 JAVA_HOME 里。
# 找不到匹配工具链时直接报错，不要静默去网上下载。
org.gradle.java.installations.paths=C:/Users/1234567/Documents/Nanbei123456/Java/jdk-21
org.gradle.java.installations.auto-download=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.11
loader_version=0.19.5
# 不要用 -SNAPSHOT：它是移动目标，Loom 每 24h 重新解析一次，
# 某天上游推个新快照就可能让你本地或 CI 突然构建失败。钉死具体版本。
loom_version=1.18.4

# Mod Properties
version=1.0.0
group=com.nanbeitnt.mod

# Dependencies
fabric_api_version=0.141.6+1.21.11
